[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralcv"
version = "0.1.0"
description = "Neural control variates for lattice field theory"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "bootstrap",
    "cv_contour",
    "cv_gauge_2d",
    "cv_gauge_3d",
    "cv_scalar",
    "fitting",
    "gevp_utils",
    "util",
    "util_pytree",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mc*", "models*"]