[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralcv"
version = "0.1.0"
description = "Neural control variates for lattice field theory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flax>=0.12.10",
    "jax[cuda12]>=0.11.2",
    "numpy>=2.5.3",
    "optax>=0.2.8",
    "optuna>=5.0.0",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "bootstrap",
    "cv_contour",
    "cv_gauge_2d",
    "cv_gauge_3d",
    "cv_scalar",
    "fitting",
    "gevp_utils",
    "util",
    "util_pytree",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mc*", "models*"]
